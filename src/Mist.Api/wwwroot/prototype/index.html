<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Міст — демонстраційний модуль документів та дуальної освіти для університетського кабінету.">
  <title>Мої документи · Міст</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="js/captcha.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/views.js"></script>
  <script defer src="js/documents.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body class="captcha-locked">
  <div id="captcha-gate" class="captcha-gate" role="dialog" aria-modal="true" aria-labelledby="captcha-title">
    <form id="captcha-form" class="captcha-card">
      <p class="captcha-kicker">Міст · демонстраційний кабінет</p>
      <h1 id="captcha-title">Підтвердіть, що ви людина</h1>
      <p>Поставте позначку Google reCAPTCHA. Для демо використано офіційний тестовий ключ Google: токен не перевіряється на сервері.</p>
      <div id="captcha-widget" class="captcha-widget" aria-label="Google reCAPTCHA"></div>
      <p class="captcha-error" id="captcha-error" role="alert" tabindex="-1"></p>
      <div class="captcha-actions">
        <button type="submit" class="btn">Увійти до кабінету</button>
        <button type="button" class="btn secondary" id="captcha-retry">Оновити перевірку</button>
      </div>
    </form>
  </div>
  <a class="skip-link" href="#main">Перейти до вмісту</a>
  <div id="app"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Для роботи прототипу увімкніть JavaScript у браузері.</noscript>
</body>
</html>
